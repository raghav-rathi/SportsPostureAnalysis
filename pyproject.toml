[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bowling-biomech"
version = "0.2.0"
description = "Pitch-calibrated, uncertainty-gated, biomechanically grounded 3D cricket fast-bowling analysis engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.3",
    "torchvision>=0.18",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bowling-biomech = "bowling_biomech.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
